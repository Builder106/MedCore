name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_NOTIFY_USER_LIST: ""

  lint:
    name: Lint (frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  format:
    name: Format (frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run format

  lint-server:
    name: Lint (server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm --prefix server ci
      - run: npm --prefix server run lint

  format-server:
    name: Format (server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm --prefix server ci
      - run: npm --prefix server run format

  test:
    name: Test & build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Typecheck server
        run: npm --prefix server run typecheck

      - name: Run server tests
        run: npm --prefix server test
